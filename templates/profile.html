{% extends "base.html" %}

{% block title %}Profile - SafePath{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <h2 class="text-center mb-5">My Profile</h2>
        
        <div class="row">
            <!-- User Information -->
            <div class="col-lg-6">
                <div class="card bg-dark border-secondary">
                    <div class="card-header">
                        <h5 class="mb-0 text-white">
                            <i class="fas fa-user me-2"></i>Account Information
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="userInfo">
                            <!-- User info will be loaded here -->
                        </div>
                    </div>
                </div>
                
                <!-- SOS Section -->
                <div class="card bg-dark border-secondary mt-4">
                    <div class="card-header">
                        <h5 class="mb-0 text-white">
                            <i class="fas fa-exclamation-triangle me-2"></i>Emergency SOS
                        </h5>
                    </div>
                    <div class="card-body">
                        <p class="text-muted">Send immediate SOS alert with your current location</p>
                        <button id="sosButton" class="btn btn-danger w-100 btn-lg">
                            <i class="fas fa-exclamation-triangle me-2"></i>SEND SOS ALERT
                        </button>
                        
                        <div class="mt-3">
                            <label class="form-label text-white">Custom SOS Message (optional)</label>
                            <textarea id="sosMessage" class="form-control" rows="2" placeholder="Additional emergency details..."></textarea>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- SOS History -->
            <div class="col-lg-6">
                <div class="card bg-dark border-secondary">
                    <div class="card-header">
                        <h5 class="mb-0 text-white">
                            <i class="fas fa-history me-2"></i>SOS Alert History
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="sosHistory">
                            <!-- SOS history will be loaded here -->
                        </div>
                    </div>
                </div>
                
                <!-- Logout -->
                <div class="card bg-dark border-secondary mt-4">
                    <div class="card-body">
                        <button id="logoutButton" class="btn btn-secondary w-100">
                            <i class="fas fa-sign-out-alt me-2"></i>Logout
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
// Load user information
async function loadUserInfo() {
    try {
        const response = await fetch('/api/auth/get_current_user');
        const data = await response.json();
        const user=data.user;
        console.log(data)
        if (data.is_authenticated) {
            document.getElementById('userInfo').innerHTML = `
                <div class="mb-3">
                    <strong class="text-white">Username:</strong>
                    <span class="text-muted ms-2">${user.username}</span>
                </div>
                <div class="mb-3">
                    <strong class="text-white">Email:</strong>
                    <span class="text-muted ms-2">${user.email}</span>
                </div>
                <div class="mb-3">
                    <strong class="text-white">Phone:</strong>
                    <span class="text-muted ms-2">${user.phone || 'N/A'}</span>
                </div>
                <div class="mb-3">
                    <strong class="text-white">Emergency Contact:</strong>
                    <span class="text-muted ms-2">${user.emergency_phone || 'N/A'}</span>
                </div>
            `;
        } else {
            document.getElementById('userInfo').innerHTML = `
                <p class="text-muted">User not logged in.</p>
            `;
        }
    } catch (error) {
        console.error('Error loading user info:', error);
        document.getElementById('userInfo').innerHTML = `
            <p class="text-danger">Failed to load user info.</p>
        `;
    }
}


// Load SOS history
async function loadSOSHistory() {
    try {
        const response = await fetch('/api/sos/alerts');
        const data = await response.json();
        
        if (data.success && data.alerts.length > 0) {
            const historyHTML = data.alerts.map(alert => `
                <div class="border-bottom border-secondary pb-3 mb-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="badge bg-${alert.status === 'active' ? 'danger' : 'success'}">${alert.status}</span>
                        <small class="text-muted">${new Date(alert.created_at).toLocaleString()}</small>
                    </div>
                    <p class="text-white mt-2 mb-1">${alert.message}</p>
                    <small class="text-muted">
                        Location: ${alert.latitude.toFixed(4)}, ${alert.longitude.toFixed(4)}
                    </small>
                    ${alert.status === 'active' ? `
                        <button class="btn btn-sm btn-success mt-2" onclick="resolveAlert(${alert.id})">
                            Mark as Resolved
                        </button>
                    ` : ''}
                </div>
            `).join('');
            
            document.getElementById('sosHistory').innerHTML = historyHTML;
        } else {
            document.getElementById('sosHistory').innerHTML = '<p class="text-muted">No SOS alerts sent yet.</p>';
        }
    } catch (error) {
        document.getElementById('sosHistory').innerHTML = '<p class="text-danger">Error loading SOS history</p>';
    }
}

// Send SOS alert
document.getElementById('sosButton').addEventListener('click', async () => {
    if (!navigator.geolocation) {
        alert('Geolocation is not supported by this browser');
        return;
    }
    
    const button = document.getElementById('sosButton');
    const originalText = button.innerHTML;
    button.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Sending SOS...';
    button.disabled = true;
        const response = await fetch('/api/auth/get_current_user');
        const data = await response.json();
        const user=data.user;
    navigator.geolocation.getCurrentPosition(async (position) => {
        try {
            console.log(1)
            console.log(user.emergency_phone)

            const response = await fetch('/api/sos/alert', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    latitude: position.coords.latitude,
                    longitude: position.coords.longitude,
                    message: document.getElementById('sosMessage').value || 'Emergency help needed!',
                    number:user.emergency_phone
                    
                })
            });
            
            const data = await response.json();
            
            if (data.success) {
                alert('SOS alert sent successfully! Emergency contacts have been notified.');
                document.getElementById('sosMessage').value = '';
                loadSOSHistory(); // Refresh history
            } else {
                alert('Failed to send SOS alert: ' + data.error);
            }
        } catch (error) {
            alert('Network error occurred while sending SOS alert');
        }
        
        button.innerHTML = originalText;
        button.disabled = false;
    }, (error) => {
        alert('Unable to get your location. Please enable location services.');
        button.innerHTML = originalText;
        button.disabled = false;
    });
});

// Resolve SOS alert
async function resolveAlert(alertId) {
    try {
        const response = await fetch(`/api/sos/alert/${alertId}/resolve`, {
            method: 'POST'
        });
        
        const data = await response.json();
        
        if (data.success) {
            loadSOSHistory(); // Refresh history
        } else {
            alert('Failed to resolve alert: ' + data.error);
        }
    } catch (error) {
        alert('Network error occurred');
    }
}

// Logout
document.getElementById('logoutButton').addEventListener('click', async () => {
    try {
        const response = await fetch('/api/auth/logout', {
            method: 'POST'
        });
        
        if (response.ok) {
            window.location.href = '/';
        }
    } catch (error) {
        console.error('Logout error:', error);
        // Force redirect even if logout request fails
        window.location.href = '/';
    }
});



// Initialize page
document.addEventListener('DOMContentLoaded', () => {
    loadUserInfo();
    loadSOSHistory();
   
});
</script>
{% endblock %}
