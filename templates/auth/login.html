{% extends "base.html" %}

{% block title %}Login - SafePath{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card bg-dark border-secondary">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <i class="fas fa-shield-alt fa-3x text-primary mb-3"></i>
                            <h3 class="text-white">Welcome Back</h3>
                            <p class="text-muted">Sign in to your SafePath account</p>
                        </div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label text-white">Username or Email</label>
                                <input type="text" id="username" class="form-control" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label text-white">Password</label>
                                <input type="password" id="password" class="form-control" required>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100 mb-3">
                                <i class="fas fa-sign-in-alt me-2"></i>Sign In
                            </button>
                        </form>

                        <div id="loginError" class="alert alert-danger d-none"></div>
                        
                        <div class="text-center">
                            <p class="text-muted">
                                Don't have an account? 
                                <a href="{{ url_for('register') }}" class="text-primary">Sign up here</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('loginError');
    
    try {
        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        if (data.success) {
            window.location.href = '/';
        } else {
            errorDiv.textContent = data.error;
            errorDiv.classList.remove('d-none');
        }
    } catch (error) {
        errorDiv.textContent = 'Network error occurred';
        errorDiv.classList.remove('d-none');
    }
});
</script>
{% endblock %}
