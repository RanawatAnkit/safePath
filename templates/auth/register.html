{% extends "base.html" %}

{% block title %}Register - SafePath{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card bg-dark border-secondary">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <i class="fas fa-user-plus fa-3x text-primary mb-3"></i>
                            <h3 class="text-white">Join SafePath</h3>
                            <p class="text-muted">Create your account for safer travel</p>
                        </div>

                        <form id="registerForm">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label text-white">Username</label>
                                    <input type="text" id="username" class="form-control" required>
                                </div>
                                
                                <div class="col-md-6">
                                    <label class="form-label text-white">Email</label>
                                    <input type="email" id="email" class="form-control" required>
                                </div>
                                
                                <div class="col-md-6">
                                    <label class="form-label text-white">Password</label>
                                    <input type="password" id="password" class="form-control" required>
                                </div>
                                
                                <div class="col-md-6">
                                    <label class="form-label text-white">Phone Number</label>
                                    <input type="tel" id="phone" class="form-control" placeholder="+91-XXXXXXXXXX">
                                </div>
                                
                                <div class="col-12">
                                    <h6 class="text-white mt-3 mb-2">Emergency Contact Information</h6>
                                    <small class="text-muted">This information will be used in case of SOS alerts</small>
                                </div>
                                
                                <div class="col-md-6">
                                    <label class="form-label text-white">Emergency Contact Name</label>
                                    <input type="text" id="emergency_contact" class="form-control" placeholder="Full Name">
                                </div>
                                
                                <div class="col-md-6">
                                    <label class="form-label text-white">Emergency Contact Phone</label>
                                    <input type="tel" id="emergency_phone" class="form-control" placeholder="+91-XXXXXXXXXX">
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100 mt-4 mb-3">
                                <i class="fas fa-user-plus me-2"></i>Create Account
                            </button>
                        </form>

                        <div id="registerError" class="alert alert-danger d-none"></div>
                        <div id="registerSuccess" class="alert alert-success d-none"></div>
                        
                        <div class="text-center">
                            <p class="text-muted">
                                Already have an account? 
                                <a href="{{ url_for('login') }}" class="text-primary">Sign in here</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const formData = {
        username: document.getElementById('username').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        phone: document.getElementById('phone').value,
        emergency_contact: document.getElementById('emergency_contact').value,
        emergency_phone: document.getElementById('emergency_phone').value
    };
    
    const errorDiv = document.getElementById('registerError');
    const successDiv = document.getElementById('registerSuccess');
    
    try {
        const response = await fetch('/api/auth/register', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(formData)
        });
        
        const data = await response.json();
        
        if (data.success) {
            successDiv.textContent = data.message;
            successDiv.classList.remove('d-none');
            errorDiv.classList.add('d-none');
            
            // Redirect to home page after successful registration
            setTimeout(() => {
                window.location.href = '/';
            }, 2000);
        } else {
            errorDiv.textContent = data.error;
            errorDiv.classList.remove('d-none');
            successDiv.classList.add('d-none');
        }
    } catch (error) {
        errorDiv.textContent = 'Network error occurred';
        errorDiv.classList.remove('d-none');
        successDiv.classList.add('d-none');
    }
});
</script>
{% endblock %}
